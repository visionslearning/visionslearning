<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TYBSc Sem 5 – MCQ Practice | Physical Chemistry</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;}

    /* Header */
    header{background:linear-gradient(135deg,#0d1b2a,#1b263b,#415a77);text-align:center;padding:36px 20px 28px;}
    header h1{font-size:2rem;letter-spacing:1px;color:#fff;}
    header p{font-size:0.95rem;color:#a8b2c1;margin-top:6px;}

    /* Progress bar */
    #progress-wrap{background:#161b22;padding:14px 20px;position:sticky;top:0;z-index:100;border-bottom:1px solid #30363d;}
    #progress-inner{max-width:800px;margin:0 auto;display:flex;align-items:center;gap:14px;}
    #progress-bar-bg{flex:1;background:#21262d;border-radius:10px;height:10px;overflow:hidden;}
    #progress-bar{height:10px;background:linear-gradient(90deg,#238636,#2ea043);border-radius:10px;transition:width 0.4s ease;width:0%;}
    #progress-text{font-size:0.82rem;color:#8b949e;white-space:nowrap;}
    #score-display{font-size:0.82rem;color:#f0883e;font-weight:600;white-space:nowrap;}

    /* Chapter tabs */
    #chapter-tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:18px 16px;background:#161b22;border-bottom:1px solid #30363d;}
    .ch-tab{padding:7px 18px;border-radius:20px;border:1px solid #30363d;background:transparent;color:#8b949e;cursor:pointer;font-size:0.85rem;transition:all 0.2s;}
    .ch-tab:hover{border-color:#58a6ff;color:#58a6ff;}
    .ch-tab.active{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600;}

    /* Main */
    .container{max-width:800px;margin:0 auto;padding:20px 20px 80px;}

    /* Chapter heading */
    .ch-heading{padding:16px 22px;border-radius:10px;margin:28px 0 18px;font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:10px;}
    .ch1-bg{background:linear-gradient(135deg,#1a2744,#0f3460);border-left:5px solid #58a6ff;}
    .ch2-bg{background:linear-gradient(135deg,#1a3a2a,#0d4a2a);border-left:5px solid #3fb950;}
    .ch3-bg{background:linear-gradient(135deg,#2d1b4e,#4a0e6e);border-left:5px solid #bc8cff;}
    .ch4-bg{background:linear-gradient(135deg,#3a1a0e,#7b2d00);border-left:5px solid #f0883e;}

    /* MCQ Card */
    .mcq-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:22px;margin-bottom:18px;transition:border-color 0.2s;}
    .mcq-card.answered-correct{border-color:#238636;background:#0d1f0f;}
    .mcq-card.answered-wrong{border-color:#da3633;background:#200d0d;}

    .q-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
    .q-num{background:#21262d;color:#8b949e;font-size:0.78rem;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;margin-top:2px;}
    .q-text{font-size:0.96rem;color:#e6edf3;line-height:1.6;flex:1;}

    /* Options */
    .options{display:flex;flex-direction:column;gap:8px;}
    .option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid #30363d;cursor:pointer;transition:all 0.15s;background:#0d1117;}
    .option:hover:not(.disabled){border-color:#58a6ff;background:#1a2744;}
    .option.disabled{cursor:default;}
    .option.selected-correct{border-color:#238636;background:#0d2910;color:#3fb950;}
    .option.selected-wrong{border-color:#da3633;background:#200d0d;color:#f85149;}
    .option.show-correct{border-color:#238636;background:#0d2910;color:#3fb950;}
    .opt-letter{font-size:0.8rem;font-weight:700;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#21262d;color:#8b949e;margin-top:1px;}
    .option.selected-correct .opt-letter{background:#238636;color:#fff;}
    .option.selected-wrong .opt-letter{background:#da3633;color:#fff;}
    .option.show-correct .opt-letter{background:#238636;color:#fff;}
    .opt-text{font-size:0.9rem;line-height:1.5;flex:1;}

    /* Explanation */
    .explanation{margin-top:12px;padding:12px 16px;background:#1c2128;border-radius:8px;border-left:3px solid #f0883e;font-size:0.88rem;color:#a8b2c1;display:none;line-height:1.6;}
    .explanation strong{color:#f0883e;}
    .explanation.show{display:block;}

    /* Result icons */
    .result-icon{float:right;font-size:1.1rem;}

    /* Nav buttons */
    #bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;padding:12px 20px;display:flex;justify-content:center;gap:12px;z-index:100;}
    .nav-btn{padding:9px 22px;border-radius:8px;border:none;cursor:pointer;font-size:0.88rem;font-weight:600;transition:all 0.2s;}
    #btn-prev{background:#21262d;color:#8b949e;}
    #btn-prev:hover{background:#30363d;color:#e6edf3;}
    #btn-next{background:#1f6feb;color:#fff;}
    #btn-next:hover{background:#388bfd;}
    #btn-submit{background:#238636;color:#fff;display:none;}
    #btn-submit:hover{background:#2ea043;}
    #btn-reset{background:#da3633;color:#fff;display:none;}
    #btn-reset:hover{background:#f85149;}

    /* Score modal */
    #score-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;align-items:center;justify-content:center;}
    #score-modal.show{display:flex;}
    #score-box{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:36px 32px;text-align:center;max-width:480px;width:90%;}
    #score-box h2{font-size:1.6rem;margin-bottom:10px;}
    #score-box .big-score{font-size:3.5rem;font-weight:800;margin:18px 0 10px;}
    #score-box p{color:#8b949e;margin-bottom:20px;}
    .score-bar-wrap{background:#21262d;border-radius:10px;height:14px;overflow:hidden;margin-bottom:24px;}
    .score-bar-fill{height:14px;border-radius:10px;transition:width 1s ease;}
    .medal{font-size:3rem;margin-bottom:8px;}
    #btn-review{background:#1f6feb;color:#fff;border:none;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:0.95rem;font-weight:600;margin-right:8px;}
    #btn-retry{background:#21262d;color:#e6edf3;border:none;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:0.95rem;}

    /* Chapter filter */
    .chapter-section{display:block;}

    /* Stats */
    .stat-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
    .stat-chip{background:#21262d;border-radius:20px;padding:5px 14px;font-size:0.82rem;color:#8b949e;}
    .stat-chip span{font-weight:700;color:#e6edf3;}

    @media(max-width:500px){
      header h1{font-size:1.4rem;}
      .mcq-card{padding:16px;}
      #score-box{padding:24px 18px;}
    }
  </style>
</head>
<body>

<header>
  <h1>📝 TYBSc Sem 5 – MCQ Practice</h1>
  <p>Physical Chemistry | All 4 Chapters | 80 Questions</p>
</header>

<div id="progress-wrap">
  <div id="progress-inner">
    <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    <div id="progress-text">0 / 60 answered</div>
    <div id="score-display">Score: 0</div>
  </div>
</div>

<div id="chapter-tabs">
  <button class="ch-tab active" onclick="filterChapter('all')">All Chapters</button>
  <button class="ch-tab" onclick="filterChapter('ch1')">Ch 1: Spectroscopy</button>
  <button class="ch-tab" onclick="filterChapter('ch2')">Ch 2: Colligative</button>
  <button class="ch-tab" onclick="filterChapter('ch3')">Ch 3: Nuclear</button>
  <button class="ch-tab" onclick="filterChapter('ch4')">Ch 4: Surface</button>
</div>

<div class="container" id="quiz-container"></div>

<div id="bottom-nav">
  <button class="nav-btn" id="btn-prev" onclick="scrollToTop()">↑ Top</button>
  <button class="nav-btn" id="btn-submit" onclick="submitQuiz()">🏆 Submit &amp; See Score</button>
  <button class="nav-btn" id="btn-reset" onclick="resetQuiz()">🔄 Reset</button>
  <button class="nav-btn" id="btn-next" onclick="scrollToNext()">Next Unanswered ↓</button>
</div>

<!-- Score Modal -->
<div id="score-modal">
  <div id="score-box">
    <div class="medal" id="modal-medal">🏆</div>
    <h2 id="modal-title">Quiz Complete!</h2>
    <div class="big-score" id="modal-score"></div>
    <div class="score-bar-wrap"><div class="score-bar-fill" id="modal-bar"></div></div>
    <p id="modal-msg"></p>
    <div class="stat-row">
      <div class="stat-chip">Correct: <span id="stat-correct">0</span></div>
      <div class="stat-chip">Wrong: <span id="stat-wrong">0</span></div>
      <div class="stat-chip">Skipped: <span id="stat-skip">0</span></div>
    </div>
    <button id="btn-review" onclick="closeModal()">📖 Review Answers</button>
    <button id="btn-retry" onclick="resetQuiz()">🔄 Try Again</button>
  </div>
</div>

<script>
const questions = [

  // ══════════════════════════════════════════
  // CHAPTER 1 – MOLECULAR SPECTROSCOPY (15 Q)
  // ══════════════════════════════════════════
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The dipole moment of CO₂ is:',
    opts: ['1.63 D', '0 D', '1.85 D', '1.47 D'],
    ans: 1,
    exp: 'CO₂ has a linear structure (O=C=O). The two C=O bond moments are equal and opposite, so they cancel vectorially → net dipole moment = 0 D.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The unit of dipole moment is:',
    opts: ['Joule', 'Debye (D)', 'Coulomb', 'Newton'],
    ans: 1,
    exp: 'Dipole moment is expressed in Debye (D). 1 D = 3.336 × 10⁻³⁰ C·m.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'Which of the following molecules has the highest dipole moment?',
    opts: ['CO₂', 'BF₃', 'H₂O', 'CH₄'],
    ans: 2,
    exp: 'H₂O has an angular structure with two O–H bonds and lone pairs on oxygen, giving a net dipole moment of 1.85 D — the highest among the options.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The dipole moment of para-dichlorobenzene is:',
    opts: ['2.6 D', '1.5 D', '0 D', '3.0 D'],
    ans: 2,
    exp: 'In para isomer, two C–Cl dipoles are exactly opposite (θ = 180°), so μ = 2μ cos(90°) = 0 D.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'Which isomer of dichlorobenzene has the highest dipole moment?',
    opts: ['ortho', 'meta', 'para', 'All equal'],
    ans: 0,
    exp: 'Ortho isomer has θ = 60° between the two C–Cl bonds, giving the largest resultant dipole moment (~2.6 D). Meta = 1.5 D, Para = 0 D.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The fingerprint region in IR spectroscopy lies between:',
    opts: ['400–600 cm⁻¹', '900–1400 cm⁻¹', '2000–2500 cm⁻¹', '3000–3500 cm⁻¹'],
    ans: 1,
    exp: 'The fingerprint region (900–1400 cm⁻¹) is unique to each compound. No two different molecules show the same pattern in this region.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'In IR spectroscopy, a vibration is active if there is a change in:',
    opts: ['Polarisability', 'Dipole moment', 'Bond order', 'Reduced mass'],
    ans: 1,
    exp: 'IR activity requires a change in dipole moment during vibration. Raman activity requires a change in polarisability.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The O–H bond in phenol absorbs IR radiation at approximately:',
    opts: ['1000 × 10² cm⁻¹', '2100 × 10² cm⁻¹', '3700 × 10² cm⁻¹', '500 × 10² cm⁻¹'],
    ans: 2,
    exp: 'The O–H (phenolic) bond has a characteristic absorption frequency of 3700 × 10² m⁻¹ due to its strong O–H stretching vibration.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'Raman Effect was discovered by C.V. Raman in:',
    opts: ['1920', '1928', '1935', '1930'],
    ans: 1,
    exp: 'Prof. C.V. Raman discovered the Raman Effect in 1928 and was awarded the Nobel Prize in Physics in 1930 for this discovery.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'Stokes lines in Raman spectroscopy appear at:',
    opts: ['Higher frequency than incident light', 'Same frequency as incident light', 'Lower frequency than incident light', 'No definite frequency'],
    ans: 2,
    exp: 'Stokes lines have lower frequency than incident light (ν_s < ν₀). The molecule absorbs energy → scattered photon has less energy → lower frequency.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'Which type of molecular vibration does NOT change bond length?',
    opts: ['Symmetric stretching', 'Asymmetric stretching', 'Bending vibration', 'None of the above'],
    ans: 2,
    exp: 'Bending vibrations involve change in bond angle, NOT bond length. Stretching vibrations change the bond length.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The stretching frequency of a bond is related to force constant (k) and reduced mass (μ) as:',
    opts: ['ν ∝ √(k·μ)', 'ν ∝ √(k/μ)', 'ν ∝ k/μ', 'ν ∝ μ/k'],
    ans: 1,
    exp: 'From the formula ν̃ = (1/2πc)√(k/μ), stretching frequency is proportional to √(k/μ). Stronger bond (higher k) → higher frequency; heavier atoms (higher μ) → lower frequency.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The O–D bond absorbs at a ________ frequency compared to O–H bond:',
    opts: ['Higher', 'Same', 'Lower', 'Depends on temperature'],
    ans: 2,
    exp: 'Deuterium (D) is heavier than H → higher reduced mass → lower frequency. O–H absorbs at ~3600 cm⁻¹, O–D at ~2630 cm⁻¹. Ratio ≈ √2.'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'The Mutual Exclusion Rule applies to:',
    opts: ['All molecules', 'Centrosymmetric molecules only', 'Polar molecules only', 'Diatomic molecules only'],
    ans: 1,
    exp: 'The Mutual Exclusion Rule states: for centrosymmetric molecules (with centre of symmetry), IR active vibrations are Raman inactive and vice versa (e.g., CO₂).'
  },
  {
    ch: 'ch1', chName: 'Chapter 1 – Molecular Spectroscopy',
    q: 'For a non-linear molecule with N atoms, the number of vibrational modes is:',
    opts: ['3N', '3N – 3', '3N – 5', '3N – 6'],
    ans: 3,
    exp: 'For a non-linear molecule: total degrees of freedom = 3N; translational = 3, rotational = 3, so vibrational = 3N – 6. For linear molecules it is 3N – 5.'
  },

  // ══════════════════════════════════════════
  // CHAPTER 2 – COLLIGATIVE PROPERTIES (15 Q)
  // ══════════════════════════════════════════
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Colligative properties depend on:',
    opts: ['Nature of solute', 'Size of solute particles', 'Number of solute particles', 'Colour of solution'],
    ans: 2,
    exp: 'Colligative properties depend only on the number of solute particles (moles) dissolved, not on their nature or identity.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Raoult\'s Law states that relative lowering of vapour pressure equals:',
    opts: ['Mole fraction of solvent', 'Mole fraction of solute', 'Molality of solution', 'Molarity of solution'],
    ans: 1,
    exp: 'Raoult\'s Law: (p° – p)/p° = x₂, where x₂ is the mole fraction of the solute. This is the relative lowering of vapour pressure.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Van\'t Hoff factor (i) for NaCl in dilute solution is approximately:',
    opts: ['1', '2', '3', '0.5'],
    ans: 1,
    exp: 'NaCl → Na⁺ + Cl⁻ (2 ions). So Van\'t Hoff factor i ≈ 2 for complete dissociation. For non-electrolytes, i = 1.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'The unit of ebullioscopic constant (K_b) is:',
    opts: ['K/mol', 'K·kg·mol⁻¹', 'mol/kg', 'mol/L'],
    ans: 1,
    exp: 'K_b (molal elevation constant) has units K·kg·mol⁻¹ because ΔT_b = K_b × m and molality m = mol/kg.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'The cryoscopic constant (K_f) of camphor used in the Rast method is:',
    opts: ['1.86 K·kg/mol', '37.7 K·kg/mol', '0.52 K·kg/mol', '5.12 K·kg/mol'],
    ans: 1,
    exp: 'Camphor has K_f = 37.7 K·kg·mol⁻¹, which is unusually high. This large value allows accurate measurement of small ΔT_f, making it ideal for molecular weight determination.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Osmotic pressure (π) is related to concentration by:',
    opts: ['π = nRT/V', 'π = nR/TV', 'π = V/nRT', 'π = RT/V'],
    ans: 0,
    exp: 'Van\'t Hoff\'s equation for osmotic pressure: πV = nRT, therefore π = nRT/V = CRT, analogous to the ideal gas law PV = nRT.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'When pressure greater than osmotic pressure is applied to the solution side, the phenomenon is called:',
    opts: ['Osmosis', 'Electro-osmosis', 'Reverse osmosis', 'Dialysis'],
    ans: 2,
    exp: 'Reverse osmosis (RO) occurs when pressure > osmotic pressure is applied to the solution, forcing solvent to flow from solution to pure solvent through SPM. Used in water purifiers.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Which colligative property is used in water purifiers?',
    opts: ['Elevation of boiling point', 'Depression of freezing point', 'Reverse osmosis', 'Vapour pressure lowering'],
    ans: 2,
    exp: 'Reverse osmosis (RO) is the principle behind household water purifiers. Pressure > osmotic pressure forces water through an RO membrane, leaving dissolved impurities behind.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'In Beckmann method, which solvent is commonly used for freezing point depression measurement?',
    opts: ['Water', 'Benzene', 'Camphor', 'Ethanol'],
    ans: 1,
    exp: 'The Beckmann method uses common solvents like benzene (K_f = 5.12) and water (K_f = 1.86). The Rast method specifically uses camphor (K_f = 37.7) for small samples.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'The vapour pressure of a liquid ________ with increase in temperature:',
    opts: ['Decreases', 'Remains same', 'Increases', 'First increases then decreases'],
    ans: 2,
    exp: 'Vapour pressure increases with temperature as more molecules gain sufficient kinetic energy to escape into the vapour phase from the liquid surface.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'The "permeate" in a reverse osmosis system refers to:',
    opts: ['Concentrated salt solution', 'Pure/desalinated water obtained', 'The semipermeable membrane', 'Feed water'],
    ans: 1,
    exp: 'In RO: Feed water = source water; Permeate = purified/desalinated water obtained; Reject stream = concentrated brine/contaminants left behind.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Van\'t Hoff factor for BaCl₂ (fully dissociated) is:',
    opts: ['1', '2', '3', '4'],
    ans: 2,
    exp: 'BaCl₂ → Ba²⁺ + 2Cl⁻ → 3 ions. So i = 3 for complete dissociation of BaCl₂.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'The flow of solvent from dilute solution to concentrated solution through SPM is called:',
    opts: ['Diffusion', 'Osmosis', 'Dialysis', 'Filtration'],
    ans: 1,
    exp: 'Osmosis is the spontaneous flow of solvent through a semipermeable membrane from a region of lower solute concentration (dilute) to higher concentration (concentrated).'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Addition of non-volatile solute to a solvent ________ its boiling point:',
    opts: ['Decreases', 'Does not change', 'Increases', 'First increases then decreases'],
    ans: 2,
    exp: 'Adding a non-volatile solute lowers the vapour pressure of the solvent, so the solution must be heated to a higher temperature to reach atmospheric pressure → elevated boiling point.'
  },
  {
    ch: 'ch2', chName: 'Chapter 2 – Chemical Thermodynamics (Colligative Properties)',
    q: 'Which formula is used in the Rast method to find molecular weight?',
    opts: [
      'M₂ = K_f × W₁ / (ΔT_f × W₂)',
      'M₂ = 1000 × K_f × W₂ / (ΔT_f × W₁)',
      'M₂ = ΔT_f × W₁ / K_f',
      'M₂ = K_f × W₂ × ΔT_f'
    ],
    ans: 1,
    exp: 'Rast method formula: M₂ = (1000 × K_f × W₂) / (ΔT_f × W₁), where W₂ = mass of solute, W₁ = mass of solvent (camphor), ΔT_f = freezing point depression.'
  },

  // ══════════════════════════════════════════
  // CHAPTER 3 – NUCLEAR CHEMISTRY (15 Q)
  // ══════════════════════════════════════════
  {
    ch: 'ch3', chName: 'Chapter 3 – Nuclear Chemistry',
    q: 'In a Photomultiplier Tube (PMT), the dynodes are arranged in:',
    opts: ['Decreasing order of positive potential', 'Increasing order of positive potential', 'Equal potential', 'Random order'],
    ans: 1,
    exp: 'In PMT, dynodes are arranged in increasing order of positive potential. Each dynode multiplies the electrons from the previous one, creating an amplified current.'
  },
  {
    ch: 'ch3', chName: 'Chapter 3 – Nuclear Chemistry',
    q: 'Radioactive isotopes used to track chemical/biological pathways are called:',
    opts: ['Isotones', 'Isobars', 'Tracers', 'Isomers'],
    ans: 2,
    exp: 'Radioactive tracers are radioisotopes used to follow the path of atoms in chemical or biological reactions. They are chemically identical to stable isotopes but detectable via radiation.'
  },
  {
    ch: 'ch3', chName: 'Chapter 3 – Nuclear Chemistry',
    q: 'In the photosynthesis tracer experiment, the O₂ released was found to come from:',
    opts: ['CO₂', 'Water (H₂O)', 'Glucose', 'Both CO₂ and H₂O'],
    ans: 1,
    exp: 'Using ¹⁸O-labelled water and CO₂, it was found that the ¹⁸O appeared in O₂ only when ¹⁸O-CO₂ was used. Hence, O₂ released in photosynthesis comes from water.'
  },
  {
    ch: 'ch3', chName: 'Chapter 3 – Nuclear Chemistry',
    q: 'In ester hydrolysis tracer experiment using H₂¹⁸O, ¹⁸O was found in:',
    opts: ['Alcohol', 'Acid (carboxylic acid)', 'Both equally', 'Neither'],
    ans: 1,
    exp: 'The ¹⁸O from labelled water appeared in the acid (carboxyl group), confirming that the acyl-oxygen bond (C–O of acid) breaks during ester hydrolysis (Path I).'
  },

// State
let answered = {}; // {index: selectedOption}
let currentFilter = 'all';
let submitted = false;

function getFilteredIndices() {
  return questions.reduce((arr, q, i) => {
    if (currentFilter === 'all' || q.ch === currentFilter) arr.push(i);
    return arr;
  }, []);
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  const indices = getFilteredIndices();
  let currentCh = '';
  let qNum = 0;

  indices.forEach(i => {
    const q = questions[i];

    // Chapter heading
    if (q.chName !== currentCh) {
      currentCh = q.chName;
      const hd = document.createElement('div');
      const colorClass = {ch1:'ch1-bg',ch2:'ch2-bg',ch3:'ch3-bg',ch4:'ch4-bg'}[q.ch];
      hd.className = `ch-heading ${colorClass}`;
      hd.innerHTML = `<span>${{ch1:'📡',ch2:'🌡️',ch3:'⚛️',ch4:'🧪'}[q.ch]}</span> ${q.chName}`;
      container.appendChild(hd);
    }

    qNum++;
    const card = document.createElement('div');
    card.className = 'mcq-card';
    card.id = `card-${i}`;

    const isAnswered = answered[i] !== undefined;
    const isCorrect = isAnswered && answered[i] === q.ans;
    if (submitted && isAnswered) {
      card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
    }

    let optsHTML = q.opts.map((opt, oi) => {
      let cls = 'option';
      let letter = String.fromCharCode(65 + oi); // A B C D
      if (submitted || isAnswered) cls += ' disabled';
      if (isAnswered && answered[i] === oi) {
        cls += isCorrect ? ' selected-correct' : ' selected-wrong';
      }
      if (submitted && oi === q.ans && (!isAnswered || answered[i] !== oi)) {
        cls += ' show-correct';
      }
      return `<div class="${cls}" onclick="selectOption(${i}, ${oi})">
        <span class="opt-letter">${letter}</span>
        <span class="opt-text">${opt}</span>
      </div>`;
    }).join('');

    const resultIcon = submitted
      ? (isAnswered ? (isCorrect ? '<span class="result-icon">✅</span>' : '<span class="result-icon">❌</span>') : '<span class="result-icon">⏭️</span>')
      : '';

    const expCls = (submitted || isAnswered) ? 'explanation show' : 'explanation';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${qNum}</span>
        <span class="q-text">${q.q} ${resultIcon}</span>
      </div>
      <div class="options">${optsHTML}</div>
      <div class="${expCls}"><strong>💡 Explanation:</strong> ${q.exp}</div>
    `;
    container.appendChild(card);
  });

  updateProgress();
  updateSubmitBtn();
}

function selectOption(qIndex, optIndex) {
  if (answered[qIndex] !== undefined || submitted) return;
  answered[qIndex] = optIndex;

  // Re-render just this card
  const q = questions[qIndex];
  const card = document.getElementById(`card-${qIndex}`);
  const isCorrect = optIndex === q.ans;
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  // Update options
  const opts = card.querySelectorAll('.option');
  opts.forEach((el, oi) => {
    el.classList.add('disabled');
    if (oi === optIndex) el.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
    if (!isCorrect && oi === q.ans) el.classList.add('show-correct');
  });

  // Show explanation
  card.querySelector('.explanation').classList.add('show');

  updateProgress();
  updateSubmitBtn();
}

function updateProgress() {
  const indices = getFilteredIndices();
  const total = indices.length;
  const done = indices.filter(i => answered[i] !== undefined).length;
  const correct = indices.filter(i => answered[i] === questions[i].ans).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total} answered`;
  document.getElementById('score-display').textContent = `Score: ${correct}`;
}

function updateSubmitBtn() {
  const indices = getFilteredIndices();
  const done = indices.filter(i => answered[i] !== undefined).length;
  const submitBtn = document.getElementById('btn-submit');
  const resetBtn = document.getElementById('btn-reset');
  if (!submitted) {
    submitBtn.style.display = done > 0 ? 'block' : 'none';
    resetBtn.style.display = 'none';
  } else {
    submitBtn.style.display = 'none';
    resetBtn.style.display = 'block';
  }
}

function submitQuiz() {
  submitted = true;
  const indices = getFilteredIndices();
  const total = indices.length;
  const correct = indices.filter(i => answered[i] === questions[i].ans).length;
  const wrong = indices.filter(i => answered[i] !== undefined && answered[i] !== questions[i].ans).length;
  const skipped = indices.filter(i => answered[i] === undefined).length;
  const pct = Math.round(correct / total * 100);

  // Set modal content
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-skip').textContent = skipped;
  document.getElementById('modal-score').textContent = `${correct} / ${total}`;

  let medal, title, msg, color;
  if (pct >= 90)      { medal='🏆'; title='Outstanding!'; msg='Excellent! You\'re fully prepared for the exam!'; color='#2ea043'; }
  else if (pct >= 75) { medal='🥇'; title='Great Job!'; msg='Very good! A little more revision and you\'re exam-ready.'; color='#58a6ff'; }
  else if (pct >= 60) { medal='🥈'; title='Good Effort!'; msg='You\'re on the right track. Revise weak topics once more.'; color='#f0883e'; }
  else if (pct >= 40) { medal='🥉'; title='Keep Trying!'; msg='Review the notes again and reattempt the quiz.'; color='#da3633'; }
  else                { medal='📚'; title='Needs More Study'; msg='Go back to the notes and study each chapter carefully.'; color='#da3633'; }

  document.getElementById('modal-medal').textContent = medal;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;

  const bar = document.getElementById('modal-bar');
  bar.style.background = color;
  bar.style.width = '0%';

  document.getElementById('score-modal').classList.add('show');
  setTimeout(() => { bar.style.width = pct + '%'; }, 100);

  renderQuiz();
}

function closeModal() {
  document.getElementById('score-modal').classList.remove('show');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetQuiz() {
  answered = {};
  submitted = false;
  document.getElementById('score-modal').classList.remove('show');
  renderQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function filterChapter(ch) {
  currentFilter = ch;
  answered = {};
  submitted = false;
  document.querySelectorAll('.ch-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function scrollToNext() {
  const indices = getFilteredIndices();
  const unanswered = indices.find(i => answered[i] === undefined);
  if (unanswered !== undefined) {
    const el = document.getElementById(`card-${unanswered}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function scrollToTop() {
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Init
renderQuiz();
</script>
</body>
</html>
