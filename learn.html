<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Lessons – Visions Classes</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #070711;
      --accent: #6366f1;
      --gold: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --pink: #ec4899;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ══════════════════════════════════
       TOPBAR
    ══════════════════════════════════ */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(7,7,17,.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 56px;
    }
    .topbar-logo { font-weight: 800; font-size: 1.1rem; color: #fff; text-decoration: none; }
    .topbar-logo span { color: var(--gold); }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .topbar-subject {
      display: flex; gap: 6px;
    }
    .subj-btn {
      padding: 5px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,.15);
      background: transparent; color: #94a3b8; cursor: pointer; font-size: .82rem; font-weight: 600;
      transition: all .2s;
    }
    .subj-btn.active-maths { background: rgba(99,102,241,.25); border-color: var(--accent); color: #a5b4fc; }
    .subj-btn.active-physics { background: rgba(245,158,11,.2); border-color: var(--gold); color: #fcd34d; }
    .home-btn {
      padding: 5px 14px; border-radius: 20px; background: rgba(255,255,255,.08);
      color: #94a3b8; text-decoration: none; font-size: .82rem; font-weight: 600;
      transition: background .2s;
    }
    .home-btn:hover { background: rgba(255,255,255,.15); color: #fff; }

    /* ══════════════════════════════════
       STAGE  (full-screen canvas area)
    ══════════════════════════════════ */
    .stage {
      position: relative;
      min-height: 100vh;
      padding-top: 56px;
      overflow: hidden;
    }

    /* starfield */
    #starfield {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }

    /* ══════════════════════════════════
       LESSON PLAYER
    ══════════════════════════════════ */
    .player {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto;
      padding: 30px 20px 100px;
    }

    /* chapter title card */
    .chapter-card {
      text-align: center; padding: 60px 20px 50px;
      display: none;
    }
    .chapter-card.active { display: block; animation: fadeUp .6s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(30px);} to{opacity:1;transform:translateY(0);} }

    .chapter-tag {
      display: inline-block; padding: 5px 18px; border-radius: 20px;
      font-size: .78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .tag-maths { background: rgba(99,102,241,.25); border: 1px solid var(--accent); color: #a5b4fc; }
    .tag-physics { background: rgba(245,158,11,.2); border: 1px solid var(--gold); color: #fcd34d; }

    .chapter-card h1 {
      font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 12px; line-height: 1.2;
    }
    .chapter-card h1.physics-title {
      background: linear-gradient(135deg, #fff 0%, #fcd34d 100%);
      -webkit-background-clip: text; background-clip: text;
    }
    .chapter-card p { color: #64748b; font-size: 1rem; }

    /* ── slide ── */
    .slide-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 36px;
      margin-bottom: 20px;
      display: none;
      position: relative; overflow: hidden;
    }
    .slide-card.active { display: block; animation: fadeUp .5s ease both; }
    .slide-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--slide-accent, linear-gradient(90deg,#6366f1,#a855f7));
    }

    .slide-card h2 {
      font-size: 1.35rem; color: #e2e8f0; margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .slide-card p, .slide-card li {
      color: #94a3b8; line-height: 1.85; font-size: .97rem;
    }
    .slide-card ul { list-style: none; padding: 0; }
    .slide-card li { padding: 6px 0 6px 24px; position: relative; }
    .slide-card li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

    /* formula box */
    .fbox {
      border-radius: 12px; padding: 18px 26px; margin: 16px 0;
      font-family: 'Courier New', monospace; font-size: 1.15rem;
      text-align: center; position: relative;
    }
    .fbox-purple { background: rgba(99,102,241,.14); border: 1px solid rgba(99,102,241,.4); color: #a5b4fc; }
    .fbox-gold   { background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.45); color: #fcd34d; }
    .fbox-green  { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.4); color: #86efac; }
    .fbox-blue   { background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.4); color: #93c5fd; }
    .fbox-pink   { background: rgba(236,72,153,.12); border: 1px solid rgba(236,72,153,.4); color: #f9a8d4; }

    .fbox-label {
      display: block; font-family: 'Segoe UI',sans-serif; font-size: .7rem;
      text-transform: uppercase; letter-spacing: 1px; opacity: .7; margin-bottom: 8px;
    }

    /* step items */
    .step { display: flex; gap: 14px; margin-bottom: 18px; }
    .step-n {
      min-width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .82rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .step-n.purple { background: linear-gradient(135deg,#6366f1,#8b5cf6); }
    .step-n.gold   { background: linear-gradient(135deg,#f59e0b,#ef4444); }
    .step-n.green  { background: linear-gradient(135deg,#22c55e,#16a34a); }
    .step-n.blue   { background: linear-gradient(135deg,#3b82f6,#6366f1); }
    .step-n.pink   { background: linear-gradient(135deg,#a855f7,#ec4899); }
    .step-body h4  { color: #e2e8f0; margin-bottom: 3px; font-size: .97rem; }
    .step-body p   { color: #94a3b8; font-size: .88rem; line-height: 1.6; }

    /* canvas wrapper */
    .canvas-wrap { display: flex; justify-content: center; margin: 20px 0; }
    canvas {
      border-radius: 12px; max-width: 100%;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.07);
    }

    /* trig table */
    table.trig {
      width: 100%; border-collapse: collapse; font-size: .88rem; margin: 14px 0;
    }
    table.trig th { background: rgba(59,130,246,.2); color: #93c5fd; padding: 9px 10px; text-align: center; font-weight: 700; }
    table.trig td { padding: 9px 10px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.05); color: #94a3b8; }
    table.trig .ang { color: #fcd34d; font-weight: 700; }

    /* identity grid */
    .id-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 12px; margin: 14px 0; }
    .id-card { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.22); border-radius: 10px; padding: 13px 16px; font-family: 'Courier New',monospace; font-size: .9rem; color: #93c5fd; text-align: center; }
    .id-card span { display:block; font-size:.68rem; color:#3b82f6; font-family:'Segoe UI',sans-serif; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }

    /* formula grid */
    .f-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 10px; margin: 14px 0; }
    .f-item { background: rgba(168,85,247,.08); border: 1px solid rgba(168,85,247,.22); border-radius: 10px; padding: 12px 16px; font-family: 'Courier New',monospace; font-size: .88rem; color: #d8b4fe; text-align: center; }
    .f-item span { display:block; font-size:.68rem; color:#a855f7; font-family:'Segoe UI',sans-serif; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }

    /* eq cards */
    .eq-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; margin: 14px 0; }
    .eq-c { background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.28); border-radius: 12px; padding: 18px; text-align: center; }
    .eq-c .en { font-size: .72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 8px; font-weight: 700; }
    .eq-c .ef { font-family: 'Courier New',monospace; font-size: 1.1rem; color: #fcd34d; margin-bottom: 6px; }
    .eq-c p { font-size: .78rem; color: #64748b; }

    /* law cards */
    .law-stack { display: flex; flex-direction: column; gap: 16px; margin: 14px 0; }
    .law-c { border-radius: 14px; padding: 22px; background: rgba(255,255,255,.04); }
    .law-c h3 { margin-bottom: 6px; font-size: 1rem; }
    .law-c p  { color: #94a3b8; font-size: .9rem; line-height: 1.6; }
    .law-c .lf { font-family: 'Courier New',monospace; color: #fcd34d; font-size: .95rem; margin-top: 8px; display:inline-block; padding: 6px 14px; background: rgba(245,158,11,.1); border-radius: 6px; }
    .law-1 { border-left: 4px solid #22c55e; }
    .law-2 { border-left: 4px solid var(--gold); }
    .law-3 { border-left: 4px solid var(--red); }

    /* series/parallel */
    .sp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 14px 0; }
    .sp-c { background: rgba(250,204,21,.06); border: 1px solid rgba(250,204,21,.18); border-radius: 12px; padding: 18px; }
    .sp-c h4 { color: #fef08a; margin-bottom: 8px; font-size: .95rem; }
    .sp-c p { color: #94a3b8; font-size: .83rem; line-height: 1.5; }
    .sp-c .sf { font-family: 'Courier New',monospace; color: #fcd34d; font-size: .88rem; margin-top: 8px; }

    /* refraction laws */
    .ref-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 12px; margin: 14px 0; }
    .ref-c { background: rgba(251,191,36,.06); border: 1px solid rgba(251,191,36,.2); border-radius: 10px; padding: 16px; }
    .ref-c h4 { color: #fde68a; margin-bottom: 6px; font-size: .9rem; }
    .ref-c p { color: #94a3b8; font-size: .82rem; line-height: 1.5; }
    .ref-c .rf { font-family: 'Courier New',monospace; color: #fcd34d; font-size: .88rem; margin-top: 6px; }

    /* ══════════════════════════════════
       CONTROLS
    ══════════════════════════════════ */
    .controls {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(7,7,17,.97);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,.07);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .ctrl-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: all .2s; flex-shrink: 0;
    }
    .ctrl-btn.play-pause {
      width: 52px; height: 52px; font-size: 1.3rem;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff; box-shadow: 0 4px 20px rgba(99,102,241,.5);
    }
    .ctrl-btn.play-pause:hover { transform: scale(1.08); }
    .ctrl-btn.prev, .ctrl-btn.next-btn {
      background: rgba(255,255,255,.09); color: #94a3b8;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.18); color: #fff; }

    .progress-track {
      flex: 1; height: 6px; background: rgba(255,255,255,.1);
      border-radius: 3px; cursor: pointer; position: relative;
    }
    .progress-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      transition: width .3s ease; pointer-events: none;
    }

    .ctrl-info { min-width: 0; flex: 0 0 auto; }
    .ctrl-title { font-size: .82rem; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .ctrl-sub   { font-size: .72rem; color: #475569; margin-top: 1px; }

    .ctrl-timer { font-size: .8rem; color: #475569; font-family: 'Courier New',monospace; flex-shrink:0; }

    /* chapter map drawer */
    .chapter-map-btn {
      background: rgba(255,255,255,.09); color: #94a3b8;
      padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer;
      font-size: .78rem; font-weight: 700; white-space: nowrap; flex-shrink: 0;
    }
    .chapter-map-btn:hover { background: rgba(255,255,255,.18); color: #fff; }

    .chapter-drawer {
      position: fixed; bottom: 70px; left: 0; right: 0; z-index: 99;
      background: rgba(10,10,24,.98); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,.08);
      max-height: 50vh; overflow-y: auto;
      transform: translateY(100%); transition: transform .3s ease;
    }
    .chapter-drawer.open { transform: translateY(0); }
    .drawer-inner { padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px; }
    .ch-pill {
      padding: 8px 16px; border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      color: #94a3b8; cursor: pointer; font-size: .82rem; font-weight: 600;
      transition: all .2s;
    }
    .ch-pill:hover { border-color: #6366f1; color: #a5b4fc; background: rgba(99,102,241,.12); }
    .ch-pill.current { border-color: #6366f1; background: rgba(99,102,241,.25); color: #a5b4fc; }
    .ch-pill.physics { }
    .ch-pill.physics:hover { border-color: var(--gold); color: #fcd34d; background: rgba(245,158,11,.15); }
    .ch-pill.physics.current { border-color: var(--gold); background: rgba(245,158,11,.2); color: #fcd34d; }

    /* auto-progress dot */
    .auto-dot {
      position: absolute; bottom: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      border-radius: 0 2px 2px 0;
      transition: none;
    }

    /* highlight text */
    .hl { color: #a5b4fc; font-weight: 700; }
    .hl-gold { color: #fcd34d; font-weight: 700; }
    .hl-green { color: #86efac; font-weight: 700; }
    .hl-red { color: #fca5a5; font-weight: 700; }
    .hl-blue { color: #93c5fd; font-weight: 700; }

    @media(max-width:600px){
      .sp-row { grid-template-columns: 1fr; }
      .ctrl-title { max-width: 100px; }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <a href="index.html" class="topbar-logo"><span>Visions</span> Classes</a>
  <div class="topbar-right">
    <div class="topbar-subject">
      <button class="subj-btn active-maths" id="btnMaths" onclick="jumpToSubject('maths')">📐 Maths</button>
      <button class="subj-btn" id="btnPhysics" onclick="jumpToSubject('physics')">⚡ Physics</button>
    </div>
    <a href="animated-lessons.html" class="home-btn">All Topics</a>
  </div>
</div>

<!-- STARFIELD -->
<canvas id="starfield"></canvas>

<div class="stage">
  <div class="player" id="player">
    <!-- slides injected by JS -->
  </div>
</div>

<!-- CHAPTER DRAWER -->
<div class="chapter-drawer" id="drawer">
  <div class="drawer-inner" id="drawerInner"></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="ctrl-btn prev" onclick="navigate(-1)" title="Previous">◀</button>
  <button class="ctrl-btn play-pause" id="playBtn" onclick="togglePlay()">⏸</button>
  <button class="ctrl-btn next-btn" onclick="navigate(1)" title="Next">▶</button>

  <div class="progress-track" id="progressTrack" onclick="seekClick(event)">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="ctrl-info">
    <div class="ctrl-title" id="ctrlTitle">Loading…</div>
    <div class="ctrl-sub" id="ctrlSub"></div>
  </div>
  <div class="ctrl-timer" id="ctrlTimer">0:00</div>
  <button class="chapter-map-btn" onclick="toggleDrawer()">☰ Topics</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   LESSON DATA
══════════════════════════════════════════════════════════════ */
const LESSONS = [

  /* ─────────────── MATHS ─────────────── */
  {
    id: 'ap', subject: 'maths', title: 'Arithmetic Progressions', class: 'Class 10',
    accent: 'linear-gradient(90deg,#6366f1,#a855f7)',
    slides: [
      {
        h: '🔢 What is an AP?',
        html: `<p>A sequence where <span class="hl">difference between consecutive terms is constant</span> — called the <span class="hl-gold">Common Difference (d)</span>.</p>
        <div class="fbox fbox-purple"><span class="fbox-label">Example AP</span>2, &nbsp;5, &nbsp;8, &nbsp;11, &nbsp;14, &nbsp;17 …</div>
        <ul><li>d = 5−2 = 3, &nbsp;8−5 = 3 → <span class="hl-gold">d = 3</span></li>
        <li>First term a = 2, Common difference d = 3</li>
        <li>d > 0 → increasing | d < 0 → decreasing AP</li></ul>`,
        canvas: 'ap_seq'
      },
      {
        h: '📌 nth Term Formula: aₙ = a + (n−1)d',
        html: `<div class="step"><div class="step-n purple">1</div><div class="step-body"><h4>a₁ = a</h4><p>First term is just a.</p></div></div>
        <div class="step"><div class="step-n purple">2</div><div class="step-body"><h4>a₂ = a + d</h4><p>Add d once.</p></div></div>
        <div class="step"><div class="step-n purple">3</div><div class="step-body"><h4>a₃ = a + 2d</h4><p>Add d twice.</p></div></div>
        <div class="step"><div class="step-n purple">4</div><div class="step-body"><h4>Pattern → aₙ = a + (n−1)d</h4><p>For nth term, add d exactly (n−1) times.</p></div></div>
        <div class="fbox fbox-gold"><span class="fbox-label">🌟 nth Term</span>aₙ = a + (n − 1) × d</div>`
      },
      {
        h: '📊 AP Bar Chart: a=3, d=4',
        html: `<p>Each bar grows by exactly <span class="hl-gold">d = 4</span> — that uniform growth is the signature of an AP!</p>`,
        canvas: 'ap_bars'
      },
      {
        h: '➕ Sum Formula: Sₙ = n/2 × [2a + (n−1)d]',
        html: `<div class="step"><div class="step-n purple">1</div><div class="step-body"><h4>Write Sₙ forward + backward</h4><p>Sₙ = a + (a+d) + … + l</p></div></div>
        <div class="step"><div class="step-n purple">2</div><div class="step-body"><h4>Add both rows</h4><p>2Sₙ = n × (a + l)</p></div></div>
        <div class="step"><div class="step-n purple">3</div><div class="step-body"><h4>Substitute l = a+(n−1)d</h4><p>2Sₙ = n(2a+(n−1)d)</p></div></div>
        <div class="fbox fbox-gold"><span class="fbox-label">🌟 Sum of n Terms</span>Sₙ = n/2 × [2a + (n−1)d]</div>`
      },
      {
        h: '✏️ Example: AP 5, 8, 11 … find a₁₀ and S₁₀',
        html: `<div class="step"><div class="step-n purple">1</div><div class="step-body"><h4>Identify a=5, d=3</h4><p>d = 8−5 = 3</p></div></div>
        <div class="step"><div class="step-n purple">2</div><div class="step-body"><h4>a₁₀ = 5 + 9×3 = <span class="hl">32</span></h4></div></div>
        <div class="step"><div class="step-n purple">3</div><div class="step-body"><h4>S₁₀ = 10/2 × (10+27) = 5×37 = <span class="hl-gold">185</span></h4></div></div>
        <div class="fbox fbox-purple">a₁₀ = <span style="color:#fcd34d">32</span> &nbsp;&nbsp; S₁₀ = <span style="color:#fcd34d">185</span></div>`
      }
    ]
  },

  {
    id: 'quad', subject: 'maths', title: 'Quadratic Equations', class: 'Class 10',
    accent: 'linear-gradient(90deg,#10b981,#06b6d4)',
    slides: [
      {
        h: '📌 What is a Quadratic Equation?',
        html: `<p>A polynomial equation of <span class="hl-green">degree 2</span>. Highest power of x is 2.</p>
        <div class="fbox fbox-green"><span class="fbox-label">Standard Form</span>ax² + bx + c = 0 &nbsp; (a ≠ 0)</div>
        <ul><li>a, b, c are coefficients</li>
        <li>2x² − 5x + 3 = 0 → a=2, b=−5, c=3</li>
        <li>The graph is a <span class="hl-gold">parabola</span></li></ul>`
      },
      {
        h: '📈 Parabola — y = x² − 5x + 6',
        html: `<p>The parabola crosses x-axis at the <span class="hl-green">roots</span>. Watch it draw!</p>`,
        canvas: 'parabola'
      },
      {
        h: '⭐ The Quadratic Formula',
        html: `<div class="fbox fbox-gold" style="font-size:1.5rem;"><span class="fbox-label">🌟 Quadratic Formula</span>x = [−b ± √(b² − 4ac)] / 2a</div>
        <p style="margin-top:12px;"><span class="hl-green">Discriminant D = b² − 4ac</span></p>
        <div class="eq-row" style="margin-top:12px;">

/* ── Starfield ── */
(function(){
  const c = document.getElementById('starfield');
  const ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const stars = Array.from({length:120},()=>({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: Math.random()*1.8+.3, a: Math.random(), da: (Math.random()-.5)*.008
  }));
  function drawStars(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.a = Math.max(.1, Math.min(1, s.a+s.da));
      if(s.a<=.1||s.a>=1) s.da*=-1;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${s.a})`; ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

/* ── Canvas animations ── */
function runCanvas(type){
  const canvas = document.getElementById('slideCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;

  if(type==='ap_seq'){
    const terms=[2,5,8,11,14,17];
    terms.forEach((t,i)=>{
      setTimeout(()=>{
        ctx.fillStyle=`rgba(99,102,241,${.4+i*.1})`;
        ctx.font='bold 22px Segoe UI'; ctx.textAlign='center';
        ctx.fillText(t, 60+i*72, H/2+8);
        if(i<terms.length-1){
          ctx.fillStyle='rgba(245,158,11,.7)'; ctx.font='16px Segoe UI';
          ctx.fillText('+3', 92+i*72, H/2-16);
        }
      }, i*280);
    });
    return;
  }

  if(type==='ap_bars'){
    const vals=[3,7,11,15,19,23];
    vals.forEach((v,i)=>{
      const targetH = v*5+10;
      const x=40+i*80, baseY=H-30;
      let h=0;
      function grow(){
        if(h>=targetH) return;
        ctx.clearRect(x-2,0,76,H);
        h = Math.min(h+5, targetH);
        const g=ctx.createLinearGradient(0,baseY-h,0,baseY);
        g.addColorStop(0,'#a855f7'); g.addColorStop(1,'#6366f1');
        ctx.fillStyle=g; ctx.beginPath();
        ctx.roundRect(x,baseY-h,54,h,6); ctx.fill();
        ctx.fillStyle='#a5b4fc'; ctx.font='bold 13px Segoe UI'; ctx.textAlign='center';
        ctx.fillText(v, x+27, baseY-h-8);
        ctx.fillStyle='#475569'; ctx.font='11px Segoe UI';
        ctx.fillText('a'+String.fromCharCode(8320+i+1), x+27, baseY+14);
        requestAnimationFrame(grow);
      }
      setTimeout(grow, i*200);
    });
    return;
  }

  if(type==='parabola'){
    const ox=W/2, oy=H/2, sx=55, sy=22;
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,10); ctx.lineTo(ox,H-10); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.font='11px Segoe UI'; ctx.textAlign='left';
    for(let x=-3;x<=5;x++){if(x===0)continue; ctx.fillText(x,ox+x*sx-4,oy+14);}
    let t=-1.5;
    function draw(){
      if(t>5.2){
        // dots at roots
        [[2,0],[3,0]].forEach(([rx])=>{
          ctx.beginPath(); ctx.arc(ox+rx*sx,oy,7,0,Math.PI*2);
          ctx.fillStyle='#fcd34d'; ctx.shadowColor='#fcd34d'; ctx.shadowBlur=12; ctx.fill(); ctx.shadowBlur=0;
          ctx.fillStyle='#fcd34d'; ctx.font='bold 12px Segoe UI'; ctx.textAlign='center';
          ctx.fillText('x='+rx,ox+rx*sx,oy-14);
        });
        return;
      }
      ctx.beginPath();
      ctx.strokeStyle='#10b981'; ctx.lineWidth=2.5; ctx.shadowColor='#10b981'; ctx.shadowBlur=6;
      for(let x=-1.5;x<=t;x+=0.04){
        const y=x*x-5*x+6;
        const px=ox+x*sx, py=oy-y*sy;
        x===-1.5?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.shadowBlur=0;
      t+=0.06; requestAnimationFrame(draw);
    }
    draw();
    return;
  }

  if(type==='unit_circle'){
    const cx=W/2, cy=H/2, r=90;
    let angle=0;
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='rgba(59,130,246,.3)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(cx-r-15,cy); ctx.lineTo(cx+r+15,cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy-r-15); ctx.lineTo(cx,cy+r+15); ctx.stroke();
      ctx.setLineDash([]);
      const px=cx+r*Math.cos(angle), py=cy-r*Math.sin(angle);
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py);
      ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2; ctx.shadowColor='#3b82f6'; ctx.shadowBlur=6; ctx.stroke(); ctx.shadowBlur=0;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,cy);
      ctx.strokeStyle='#f59e0b'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,cy);
      ctx.strokeStyle='#22c55e'; ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#f59e0b'; ctx.font='11px Segoe UI'; ctx.textAlign='left';
      ctx.fillText('sin θ',px+6,(py+cy)/2);
      ctx.fillStyle='#22c55e';
      ctx.fillText('cos θ',(cx+px)/2-20,cy+16);
      ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='12px Segoe UI';
      ctx.fillText(Math.round(angle*180/Math.PI)+'°',cx+r+5,cy-5);
      angle+=0.025; if(angle>Math.PI*2) angle=0;
      requestAnimationFrame(draw);
    }
    draw();
    return;
  }

  if(type==='integ_area'){
    const ox=40,oy=H-30,sx=100,sy=20;
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ox,20); ctx.lineTo(ox,oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox-5,oy); ctx.lineTo(W-10,oy); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.font='11px Segoe UI';
    for(let x=0;x<=3;x++) { ctx.textAlign='center'; ctx.fillText(x,ox+x*sx,oy+14); }
    let fill=0;
    function draw(){
      if(fill>3.05) return;
      ctx.clearRect(ox+1,0,W,oy);
      ctx.beginPath(); ctx.moveTo(ox,oy);
      for(let x=0;x<=fill;x+=0.02){ ctx.lineTo(ox+x*sx, oy-x*x*sy); }
      ctx.lineTo(ox+fill*sx,oy); ctx.closePath();
      ctx.fillStyle='rgba(168,85,247,.25)'; ctx.fill();
      ctx.beginPath(); ctx.strokeStyle='#d8b4fe'; ctx.lineWidth=2.5;
      for(let x=0;x<=3;x+=0.03){ const px=ox+x*sx,py=oy-x*x*sy; x===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
      ctx.stroke();
      fill+=0.04; requestAnimationFrame(draw);
    }
    draw();
    setTimeout(()=>{
      ctx.fillStyle='#fcd34d'; ctx.font='bold 14px Segoe UI'; ctx.textAlign='center';
      ctx.fillText('Area = 9', ox+sx*1.5, oy-sy*3);
    },1600);
    return;
  }

  if(type==='motion_graphs'){
    const lx=40,ly=H-30,roffset=W/2+20;
    function drawAxes(ox,label){
      ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(ox,30); ctx.lineTo(ox,ly); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox-5,ly); ctx.lineTo(ox+180,ly); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.3)'; ctx.font='11px Segoe UI'; ctx.textAlign='left';
      ctx.fillText(label,ox+60,22);
    }
    drawAxes(lx,'d-t Graph'); drawAxes(roffset,'v-t Graph');
    let t=0;
    function draw(){
      if(t>160) return;
      if(t<160){
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx+t,ly-t*0.8);
        ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2.5; ctx.shadowColor='#f59e0b'; ctx.shadowBlur=5; ctx.stroke(); ctx.shadowBlur=0;
        ctx.beginPath(); ctx.moveTo(roffset,ly); ctx.lineTo(roffset+t,ly-t*0.8);
        ctx.strokeStyle='#ef4444'; ctx.lineWidth=2.5; ctx.shadowColor='#ef4444'; ctx.shadowBlur=5; ctx.stroke(); ctx.shadowBlur=0;
        // area under v-t
        ctx.beginPath(); ctx.moveTo(roffset,ly); ctx.lineTo(roffset+t,ly-t*0.8); ctx.lineTo(roffset+t,ly); ctx.closePath();
        ctx.fillStyle='rgba(239,68,68,.12)'; ctx.fill();
      }
      t+=2; requestAnimationFrame(draw);
    }
    draw();
    return;
  }

  if(type==='newton_balls'){
    let lx=50, rx=W/2+30, frame=0;
    const lR=18, hR=32;
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,H-35); ctx.lineTo(W,H-35); ctx.stroke();
      // light ball
      ctx.beginPath(); ctx.arc(lx,H-35-lR,lR,0,Math.PI*2);
      ctx.fillStyle='#22c55e'; ctx.shadowColor='#22c55e'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.font='bold 9px Segoe UI'; ctx.textAlign='center';
      ctx.fillText('2kg',lx,H-35-lR+4);
      // heavy ball
      ctx.beginPath(); ctx.arc(rx,H-35-hR,hR,0,Math.PI*2);
      ctx.fillStyle='#ef4444'; ctx.shadowColor='#ef4444'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.font='bold 9px Segoe UI'; ctx.textAlign='center';
      ctx.fillText('8kg',rx,H-35-hR+4);
      // force arrows
      ctx.strokeStyle='#fcd34d'; ctx.lineWidth=2.5; ctx.fillStyle='#fcd34d';
      [lx-lR-28, rx-hR-28].forEach(ax=>{
        ctx.beginPath(); ctx.moveTo(ax,H-35-28); ctx.lineTo(ax+24,H-35-28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ax+24,H-35-35); ctx.lineTo(ax+34,H-35-28); ctx.lineTo(ax+24,H-35-21); ctx.fill();
      });
      ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='10px Segoe UI';
      ctx.textAlign='center'; ctx.fillText('F=10N',lx,H-15); ctx.fillText('F=10N',rx,H-15);
      ctx.fillStyle='#22c55e'; ctx.fillText('a=5m/s²',lx,H-4);
      ctx.fillStyle='#ef4444'; ctx.fillText('a=1.25m/s²',rx,H-4);

      lx += 2; rx += 0.5;
      if(lx>W-20){ lx=50; rx=W/2+30; }
      frame++; requestAnimationFrame(draw);
    }
    draw();
    return;
  }

  if(type==='circuit'){
    const left=60,top=40,right=420,bottom=160,cy=(top+bottom)/2;
    const path=[];
    for(let x=left;x<=right;x+=10) path.push({x,y:top});
    for(let y=top;y<=bottom;y+=10) path.push({x:right,y});
    for(let x=right;x>=left;x-=10) path.push({x,y:bottom});
    for(let y=bottom;y>=top;y-=10) path.push({x:left,y});
    const dots=[]; for(let i=0;i<8;i++) dots.push({pos:Math.floor(path.length/8)*i});
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='rgba(250,204,21,.35)'; ctx.lineWidth=2.5;
      ctx.strokeRect(left,top,right-left,bottom-top);
      // Battery
      [[cy-18,10],[cy-8,18],[cy+2,10],[cy+12,18]].forEach(([y,w])=>{
        ctx.beginPath(); ctx.moveTo(left-w/2,y); ctx.lineTo(left+w/2,y);
        ctx.strokeStyle='#facc15'; ctx.lineWidth=2; ctx.stroke();
      });
      ctx.fillStyle='#fef08a'; ctx.font='11px Segoe UI'; ctx.textAlign='center'; ctx.fillText('6V',left,cy+30);
      // Resistor zigzag
      const rx=(left+right)/2;
      ctx.beginPath(); ctx.moveTo(rx-30,top);
      for(let i=0;i<=8;i++) ctx.lineTo(rx-30+i*7.5, top+(i%2===0?-8:8));
      ctx.lineTo(rx+30,top);
      ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#f59e0b'; ctx.fillText('30Ω',rx,top-14);
      // Electrons
      dots.forEach(d=>{
        const p=path[d.pos%path.length];
        ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fillStyle='#60a5fa'; ctx.shadowColor='#60a5fa'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
        d.pos=(d.pos+1)%path.length;
      });
      requestAnimationFrame(draw);
    }
    draw();
    return;
  }

  if(type==='reflection'){
    const mx=330,my=H/2;
    let t=0;
    const rpy=my-42, rpx=mx+rpy*rpy*0.011;
    function draw(){
      ctx.clearRect(0,0,W,H);
      // Mirror
      ctx.beginPath();
      for(let y=-80;y<=80;y+=2){const x=mx+y*y*0.011;y===-80?ctx.moveTo(x,my+y):ctx.lineTo(x,my+y);}
      ctx.strokeStyle='rgba(251,191,36,.7)'; ctx.lineWidth=3; ctx.stroke();
      // Axis
      ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(40,my); ctx.lineTo(W-10,my); ctx.stroke(); ctx.setLineDash([]);
      // Normal
      ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(rpx,rpy-50); ctx.lineTo(rpx,rpy+50); ctx.stroke(); ctx.setLineDash([]);
      // Focal point
      ctx.beginPath(); ctx.arc(mx-55,my,5,0,Math.PI*2);
      ctx.fillStyle='#fcd34d'; ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='11px Segoe UI'; ctx.fillText('F',mx-50,my+16);
      // Incident ray
      const ex=60+(rpx-60)*Math.min(t/100,1);
      const ey=30+(rpy-30)*Math.min(t/100,1);
      ctx.beginPath(); ctx.moveTo(60,30); ctx.lineTo(ex,ey);
      ctx.strokeStyle='#fb923c'; ctx.lineWidth=2.5; ctx.shadowColor='#fb923c'; ctx.shadowBlur=6; ctx.stroke(); ctx.shadowBlur=0;
      // Reflected
      if(t>100){
        const rt=t-100;
        ctx.beginPath(); ctx.moveTo(rpx,rpy);
        ctx.lineTo(rpx+(mx-75-rpx)*Math.min(rt/80,1), rpy+(my-rpy)*Math.min(rt/80,1));
        ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2.5; ctx.shadowColor='#fbbf24'; ctx.shadowBlur=6; ctx.stroke(); ctx.shadowBlur=0;
      }
      t=t<200?t+1.8:0;
      requestAnimationFrame(draw);
    }
    draw();
    return;
  }

  if(type==='refraction'){
    const sy=H/2;
    ctx.fillStyle='rgba(59,130,246,.07)'; ctx.fillRect(0,sy,W,H-sy);
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.font='11px Segoe UI';
    ctx.textAlign='left'; ctx.fillText('Air (n=1)',20,sy-12);
    ctx.fillText('Glass (n=1.5)',20,sy+18);
    const cx=W/2;
    ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,15); ctx.lineTo(cx,H-15); ctx.stroke(); ctx.setLineDash([]);
    let t=0;
    function draw(){
      ctx.clearRect(0,sy-1,W,H);
      ctx.fillStyle='rgba(59,130,246,.07)'; ctx.fillRect(0,sy,W,H-sy);
      ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(W,sy); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.2)'; ctx.font='11px Segoe UI'; ctx.textAlign='left';
      ctx.fillText('Air',20,sy+18); ctx.fillText('Glass',20,sy+34);
      const ex=cx-80+(cx-cx+80)*Math.min(t/100,1);
      const ey=20+(sy-20)*Math.min(t/100,1);
      ctx.beginPath(); ctx.moveTo(cx-80,20); ctx.lineTo(ex,ey);
      ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2.5; ctx.shadowColor='#fbbf24'; ctx.shadowBlur=6; ctx.stroke(); ctx.shadowBlur=0;
      if(t>100){
        const rt=Math.min(t-100,100);
        ctx.beginPath(); ctx.moveTo(cx,sy);
        ctx.lineTo(cx+rt*0.3, sy+rt*1.5);
        ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2.5; ctx.shadowColor='#60a5fa'; ctx.shadowBlur=6; ctx.stroke(); ctx.shadowBlur=0;
        ctx.fillStyle='#60a5fa'; ctx.font='11px Segoe UI'; ctx.fillText('θ₂',cx+15,sy+40);
      }
      ctx.fillStyle='#fbbf24'; ctx.font='11px Segoe UI'; ctx.fillText('θ₁',cx-65,sy-20);
      t=t<210?t+2:0;
      requestAnimationFrame(draw);
    }
    draw();
    return;
  }
}

/* ══════════════════════════════════════════════════════════════
   NAVIGATION & AUTO-PLAY
══════════════════════════════════════════════════════════════ */
function navigate(dir){
  currentIdx = Math.max(0, Math.min(flatSlides.length-1, currentIdx+dir));
  render();
  document.getElementById('player').scrollIntoView({behavior:'smooth',block:'start'});
}

function jumpToLesson(lessonIdx){
  const idx = flatSlides.findIndex(f=>f.lessonIdx===lessonIdx);
  if(idx>=0){ currentIdx=idx; render(); }
  document.getElementById('player').scrollIntoView({behavior:'smooth'});
}

function jumpToSubject(subj){
  const idx = flatSlides.findIndex(f=>f.lesson.subject===subj);
  if(idx>=0){ currentIdx=idx; render(); }
}

function togglePlay(){
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
}

function toggleDrawer(){
  document.getElementById('drawer').classList.toggle('open');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('#drawer') && !e.target.closest('.chapter-map-btn'))
    document.getElementById('drawer').classList.remove('open');
});

function seekClick(e){
  const rect = document.getElementById('progressTrack').getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  currentIdx = Math.round(pct*(flatSlides.length-1));
  render();
}

/* Auto-advance timer */
let timerInterval = setInterval(()=>{
  if(!isPlaying) return;
  secondsOnSlide++;
  const pct = secondsOnSlide/SLIDE_DURATION*100;
  // timer display
  document.getElementById('ctrlTimer').textContent =
    Math.floor(secondsOnSlide/60)+':'+(secondsOnSlide%60).toString().padStart(2,'0');
  if(secondsOnSlide>=SLIDE_DURATION){
    if(currentIdx < flatSlides.length-1) navigate(1);
    else { isPlaying=false; document.getElementById('playBtn').textContent='▶'; }
  }
}, 1000);

// Keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') navigate(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') navigate(-1);
  if(e.key===' ') { e.preventDefault(); togglePlay(); }
});

// Init
render();
</script>
