  'quad-3': `Let us solve a complete problem step by step. The equation is 2x squared minus 7x plus 3 equals zero.

Step 1 — identify the coefficients. a equals 2, b equals minus 7, c equals 3.

Step 2 — calculate the discriminant. D equals b squared minus 4ac equals minus 7 squared minus 4 times 2 times 3 equals 49 minus 24 equals 25.

Since D equals 25 which is greater than zero, we have two distinct real roots. Good.

Step 3 — apply the quadratic formula. x equals minus b plus or minus root D, divided by 2a. Equals 7 plus or minus root 25, divided by 4. Equals 7 plus or minus 5, divided by 4.

Step 4 — find both roots. x1 equals 7 plus 5 over 4 equals 12 over 4 equals 3. x2 equals 7 minus 5 over 4 equals 2 over 4 equals one half.

Verification — put x equals 3 in the original equation. 2 times 9 minus 21 plus 3 equals 18 minus 21 plus 3 equals 0. Correct! Put x equals one half. 2 times one quarter minus 7 over 2 plus 3 equals one half minus three point five plus three equals zero. Correct!

Always verify your roots — it takes 30 seconds and confirms your answer completely.`,

  /* ════════════════════════════════════════
     TRIGONOMETRY — Class 10
  ════════════════════════════════════════ */
  'trig-0': `Welcome students! Today we begin Trigonometry — a subject that has been used for thousands of years by astronomers, architects, engineers and navigators.

Trigonometry is the study of the relationship between the angles and sides of a right-angled triangle.

Consider a right triangle. One angle is 90 degrees. Another angle we call theta. The side opposite to the 90 degree angle — the longest side — is the Hypotenuse. The side opposite to theta is called the Opposite side. And the side adjacent to theta — next to it — is the Adjacent side.

The three basic trigonometric ratios are sine, cosine, and tangent. And the best way to remember them is SOH CAH TOA.

SOH — Sine equals Opposite over Hypotenuse.
CAH — Cosine equals Adjacent over Hypotenuse.
TOA — Tangent equals Opposite over Adjacent.

There are three more ratios — cosecant, secant, and cotangent — which are simply the reciprocals. Cosecant equals 1 over sine. Secant equals 1 over cosine. Cotangent equals 1 over tangent.

These six ratios are the foundation of all trigonometry. Once you understand what each ratio means geometrically — as a ratio of two specific sides — everything else in trigonometry becomes clear.`,

  'trig-1': `Now I want to show you the unit circle — the most powerful visualisation tool in trigonometry.

A unit circle is a circle with radius exactly 1, placed at the origin of a coordinate system. Imagine a point moving around this circle. For any position of the point, the angle it makes at the centre with the positive x-axis is theta.

Here is the beautiful fact — the x-coordinate of that point is exactly cosine theta, and the y-coordinate is exactly sine theta.

Watch the animation. As the point moves around the circle, the horizontal distance from the centre is cosine theta — shown in green. The vertical distance from the x-axis is sine theta — shown in orange.

This leads directly to the most fundamental identity in trigonometry. Since the point is on a circle of radius 1, by Pythagoras theorem — x squared plus y squared equals 1. Which means cosine squared theta plus sine squared theta equals 1.

This is the Pythagorean identity, and it is true for every angle theta without exception. This identity is the starting point for proving most other trigonometric identities.

The unit circle also explains why trigonometric functions are periodic — the point keeps going around the circle, so the values of sine and cosine repeat every 360 degrees.`,

  'trig-2': `Students, now you must memorise the values of trigonometric ratios at the five standard angles — 0, 30, 45, 60, and 90 degrees. These values appear in almost every trigonometry problem in your exam.

Let me give you the easiest trick ever for sine values. Write root 0 over 2, root 1 over 2, root 2 over 2, root 3 over 2, root 4 over 2. Simplify each — you get 0, one half, 1 over root 2, root 3 over 2, and 1. These are the sine values at 0, 30, 45, 60, and 90 degrees respectively.

For cosine — just read the sine values in reverse order. Cosine at 0 is 1, at 30 is root 3 over 2, at 45 is 1 over root 2, at 60 is one half, at 90 is 0.

For tangent — divide sine by cosine. Tan 30 equals one half divided by root 3 over 2 equals 1 over root 3. Tan 45 equals 1. Tan 60 equals root 3. Tan 90 is undefined — we say infinity — because cosine 90 is zero, and we cannot divide by zero.

Please write these values on a small card and revise them daily until they are automatic. In exams, these values come up in almost every question.`,

  'trig-3': `Now let us study the trigonometric identities — these are equations that are true for all values of the angle theta.

The three Pythagorean identities are the most important. First — sine squared theta plus cosine squared theta equals 1. This is the original identity from the unit circle.

Second — 1 plus tangent squared theta equals secant squared theta. This is obtained by dividing the first identity by cosine squared theta.

Third — 1 plus cotangent squared theta equals cosecant squared theta. This is obtained by dividing the first identity by sine squared theta.

Then there are the complementary angle identities. Sine of 90 minus theta equals cosine theta. Cosine of 90 minus theta equals sine theta. Tangent of 90 minus theta equals cotangent theta. These make sense because the sine of an angle in a right triangle equals the cosine of the other acute angle — they are complementary.

In exams, identity problems follow a pattern — take the more complex side, substitute the identities, simplify step by step until you reach the simpler side. Never work on both sides simultaneously. Work on one side only and transform it into the other.`,

  /* ════════════════════════════════════════
     INTEGRATION — Class 12
  ════════════════════════════════════════ */
  'integ-0': `Hello students! Welcome to Integration — the second major branch of Calculus, alongside Differentiation.

If differentiation is about finding the rate of change — how fast something is changing — then integration is about finding the total accumulated change. They are two sides of the same coin.

Formally — the integral of a function f of x with respect to x is another function F of x, such that the derivative of F of x is f of x. We write this as the integral of f of x dx equals F of x plus C.

The symbol for integration is an elongated S — it stands for Sum, because integration was originally conceived as the sum of infinitely many infinitely thin rectangles under a curve.

The plus C at the end — called the constant of integration — is extremely important. When we differentiate, constant terms vanish. So when we integrate, we must acknowledge that any constant could have been there. Always write plus C for indefinite integrals or you will lose marks.

The integral without limits — no numbers at the bottom and top of the integration sign — is called an indefinite integral. It gives a family of functions. The integral with limits a and b is called a definite integral, and it gives a specific numerical value — the area under the curve from x equals a to x equals b.`,

  'integ-1': `Now let me show you the geometric meaning of integration — it is the area under a curve.

Look at the graph of y equals x squared. This is a parabola opening upward. We want to find the area of the region bounded by this curve, the x-axis, and the vertical lines x equals 0 and x equals 3.

Visually — watch as the area is filled in from left to right. The region is wider at the top because the parabola rises steeply, and narrower at the bottom near the origin.

Mathematically — the definite integral of x squared from 0 to 3 equals x cubed over 3, evaluated from 0 to 3. At x equals 3 — 27 over 3 equals 9. At x equals 0 — 0 over 3 equals 0. So the area equals 9 minus 0 equals 9 square units.

This is the Fundamental Theorem of Calculus — integration and differentiation are inverse operations. To evaluate a definite integral, find the antiderivative, then substitute the upper limit minus the lower limit.

This geometric interpretation is powerful. It is used to find areas of irregular shapes, volumes of solids, work done by a variable force, distance from velocity, and many more applications in physics and engineering.`,

  'integ-2': `Students, let me give you the standard integration formulas — these are your tools. Just like you need a formula sheet for differentiation, you need these for integration.

The Power Rule — the integral of x to the power n is x to the power n plus 1, divided by n plus 1, plus C. This works for all values of n except n equals minus 1.

Special case for n equals minus 1 — the integral of 1 over x is the natural logarithm of the absolute value of x, plus C.

For exponentials — the integral of e to the x is simply e to the x plus C. The integral of a to the x is a to the x divided by log a, plus C.

For trigonometric functions — the integral of sin x is minus cos x plus C. The integral of cos x is sin x plus C. Remember — integration of sine gives negative cosine, not positive. Many students make this mistake.

The integral of sec squared x is tan x plus C. The integral of cosec squared x is minus cot x plus C.

These formulas come directly from reversing the differentiation formulas you already know. If the derivative of sin x is cos x, then the integral of cos x must be sin x. Use this logic to reconstruct any formula you forget.`,

  'integ-3': `Let us solve a complete integration problem step by step. We need to find the integral of 3x squared plus 2x plus 5 with respect to x.

The key technique here is linearity — we can split the integral of a sum into separate integrals, and pull constants outside the integral sign.

Step 1 — split the integral. It becomes the integral of 3x squared dx, plus the integral of 2x dx, plus the integral of 5 dx.

Step 2 — pull constants out. It becomes 3 times integral of x squared, plus 2 times integral of x, plus 5 times integral of 1.

Step 3 — apply the power rule to each. Integral of x squared is x cubed over 3. Integral of x is x squared over 2. Integral of 1 is x.

Step 4 — multiply back the constants. 3 times x cubed over 3 gives x cubed. 2 times x squared over 2 gives x squared. 5 times x gives 5x.

Final answer — x cubed plus x squared plus 5x plus C.

Verification — differentiate x cubed plus x squared plus 5x. Derivative is 3x squared plus 2x plus 5. That matches our original function. Correct!

Always verify your integration by differentiating the answer and checking it matches the original function.`,

  /* ════════════════════════════════════════
     MOTION — Class 9 Physics
  ════════════════════════════════════════ */
  'motion-0': `Hello students! Welcome to the chapter on Motion in Physics. This chapter is absolutely fundamental — everything in mechanics builds on what we learn here.

Let us start by understanding the difference between some very important terms that are often confused.

Distance is the total length of the path covered by an object, regardless of direction. It is a scalar quantity — it has only magnitude, no direction. If you walk 5 metres forward and 5 metres back, the distance is 10 metres.

Displacement is the shortest straight-line distance from the starting point to the ending point, measured in a specific direction. It is a vector quantity — it has both magnitude and direction. In the same example, if you started and ended at the same point, the displacement is zero.

Speed is distance divided by time. It tells you how fast something is moving, but not in which direction. It is scalar.

Velocity is displacement divided by time. It has both magnitude and direction. It is a vector. This is why in physics we always use velocity in equations, not speed.

Acceleration is the rate of change of velocity. If the velocity increases, acceleration is positive. If velocity decreases, we call it deceleration or retardation, and acceleration is negative. Acceleration is also a vector quantity. The SI unit of acceleration is metres per second squared.`,

  'motion-1': `Now let us understand the two most important graphs in the study of motion — the distance-time graph and the velocity-time graph.

On the distance-time graph, time is plotted on the x-axis and distance on the y-axis. The slope of this graph at any point gives the speed. A straight sloping line means the object is covering equal distances in equal time intervals — this is uniform motion, or constant speed. A horizontal straight line means the object is stationary — distance is not changing. A curve means the speed is changing — non-uniform motion.

On the velocity-time graph, time is on the x-axis and velocity on the y-axis. The slope of this graph gives acceleration. A straight sloping line upward means uniform acceleration — velocity is increasing at a constant rate. A horizontal line means zero acceleration — constant velocity. A downward slope means deceleration.

Very importantly — the area under the velocity-time graph gives the displacement. This is why integration is so powerful in physics — the integral of velocity over time gives displacement.

These graphs are frequently asked in exams. Practice drawing them for different types of motion — uniform, uniformly accelerated, and non-uniform. Understanding graphs is as important as knowing the formulas.`,

  'motion-2': `Now we come to the heart of this chapter — the three equations of motion. These equations apply when an object moves in a straight line with uniform acceleration — meaning the acceleration is constant.

The three equations are —
First equation — v equals u plus at.
Second equation — s equals ut plus one half at squared.
Third equation — v squared equals u squared plus 2as.

Here — u is the initial velocity, meaning the velocity at the start. v is the final velocity after time t. a is the uniform acceleration. s is the displacement. And t is the time elapsed.

The first equation is derived directly from the definition of acceleration — a equals v minus u over t. Rearranging gives v equals u plus at.

The second equation gives displacement in terms of time. It is derived from the area under the velocity-time graph.

The third equation is most useful when time is not given and not required. It eliminates t by combining the first and second equations.

For each problem, first identify which quantities are given and which one you need to find. Then choose the equation that contains exactly those quantities. This systematic approach will solve any motion problem.`,

  'motion-3': `Let us solve a problem to put everything together.

A car starts from rest — which means the initial velocity u equals zero. It accelerates uniformly at 4 metres per second squared. We need to find the velocity after 5 seconds and the distance covered in those 5 seconds.

Given — u equals 0, a equals 4 metres per second squared, t equals 5 seconds. We need to find v and s.

For velocity — use the first equation. v equals u plus at. v equals 0 plus 4 times 5. v equals 20 metres per second.

So after 5 seconds, the car is moving at 20 metres per second. That is 72 kilometres per hour. Quite fast!

For distance — use the second equation. s equals ut plus half at squared. s equals 0 times 5 plus half times 4 times 25. s equals 0 plus 50. s equals 50 metres.

We can also verify using the third equation. v squared equals u squared plus 2as. 400 equals 0 plus 2 times 4 times s. s equals 400 over 8 equals 50 metres. Same answer!

The key step in every motion problem is to make a table — write down what is given and what is unknown — then select the correct equation. Never start substituting without identifying u, v, a, s, and t.`,

  /* ════════════════════════════════════════
     NEWTON'S LAWS — Class 9 Physics
  ════════════════════════════════════════ */
  'newton-0': `Hello students! Today we study the three laws that changed the world — Newton's Laws of Motion, published in 1687 in the famous book Principia Mathematica.

Before Newton, people believed that a force was needed to keep something moving. Newton proved them wrong.

Newton's First Law — also called the Law of Inertia — states that an object at rest remains at rest, and an object moving with constant velocity continues to move with that same constant velocity, unless an external unbalanced force acts on it.

The key concept here is inertia — the tendency of an object to resist any change in its state of motion. Heavier objects have more inertia.

Newton's Second Law — the most mathematical of the three — states that the acceleration of an object is directly proportional to the net force acting on it, and inversely proportional to its mass. This gives us the famous formula F equals ma. Force equals mass times acceleration.

Newton's Third Law — for every action force, there is an equal and opposite reaction force. These action and reaction forces act on different objects, never on the same object.

These three laws completely describe how objects move under forces. Together, they form the foundation of classical mechanics — the physics that governs everything from a rolling ball to a flying rocket.`,

  'newton-1': `Watch this animation carefully — it demonstrates Newton's Second Law beautifully.

We apply the same force of 10 Newtons to two different balls. The green ball has a mass of only 2 kilograms. The red ball is much heavier — 8 kilograms.

Using Newton's second law — F equals ma, which means a equals F divided by m.

For the green ball — a equals 10 divided by 2 equals 5 metres per second squared. It shoots forward quickly!

For the red ball — a equals 10 divided by 8 equals 1.25 metres per second squared. It moves much more slowly.

Watch the animation — the green ball accelerates much faster than the red one, even though the same force is applied to both.

This is the essence of the second law — for a given force, greater mass means less acceleration. If you double the mass, the acceleration becomes half. If you triple the force, the acceleration triples.

This is why trucks need much more powerful engines than motorcycles to achieve the same acceleration. This is why pushing a loaded trolley is harder than pushing an empty one. The second law governs all of these everyday experiences.

In every Force and acceleration problem — always calculate the net force first, then divide by mass to get acceleration.`,

  'newton-2': `Let us look at some real-life applications of Newton's laws — because physics is not just about equations, it is about understanding the world around you.

Seatbelts and Newton's First Law — When a car is moving and suddenly brakes hard, the car decelerates rapidly. But your body wants to keep moving forward at the original speed — that is inertia, the first law. The seatbelt applies an external backward force to your body, stopping you safely. Without it, you would continue moving forward and hit the windshield. This is why seatbelts save lives.

Rockets and Newton's Third Law — A rocket engine burns fuel and expels hot exhaust gases at very high speed in the backward direction. By the third law, the rocket experiences an equal and opposite force in the forward direction. This reaction force is what propels the rocket. There is nothing to push against in space — the rocket pushes against its own exhaust gases.

Walking and Newton's Third Law — When you walk, your foot pushes backward against the ground. By the third law, the ground pushes your foot forward. This forward push from the ground is what moves you. If the ground were perfectly frictionless — like ice — this push would not work, and you would slip.

These examples show that Newton's laws are not abstract equations — they are explanations of everything we experience every day.`,

  'newton-3': `Let us solve a numerical problem involving Newton's second law with friction.

A force of 50 Newtons is applied to a box of mass 10 kilograms. The floor exerts a friction force of 10 Newtons opposing the motion. Find the acceleration of the box.

Step 1 — identify all forces. Applied force F equals 50 Newtons in the forward direction. Friction force f equals 10 Newtons in the backward direction.

Step 2 — calculate the net force. Net force equals applied force minus friction equals 50 minus 10 equals 40 Newtons.

This step is critical. Newton's second law uses the NET force — the resultant of all forces acting on the object, not just the applied force. Many students use only the applied force and get the wrong answer.

Step 3 — apply Newton's second law. a equals net force divided by mass equals 40 divided by 10 equals 4 metres per second squared.

So the box accelerates at 4 metres per second squared.

Without friction, the acceleration would have been 50 over 10 equals 5 metres per second squared. Friction reduced the acceleration from 5 to 4 metres per second squared.

Always draw a free body diagram showing all forces — applied force, friction, normal force, weight — before writing any equation. This prevents mistakes and makes the solution systematic.`,

  /* ════════════════════════════════════════
     ELECTRICITY — Class 10 Physics
  ════════════════════════════════════════ */
  'elec-0': `Hello students! Welcome to the chapter on Electricity — one of the most practical and important chapters in Class 10 Physics.

Let us begin with the fundamental concept — electric current. Everything starts with electric charge. Matter is made of atoms, which contain positively charged protons in the nucleus and negatively charged electrons around it. In a conductor like copper wire, some electrons are free to move.

When we connect a battery to a wire, the battery creates an electric field that pushes these free electrons through the wire. This flow of electric charge is called electric current.

Electric Current I is defined as the charge Q flowing per unit time t. So I equals Q divided by t. The unit of current is the Ampere, named after the French physicist André-Marie Ampère. 1 Ampere means 1 Coulomb of charge flowing per second.

Voltage, also called potential difference, is what drives the current. It is the difference in electric potential energy per unit charge between two points. The unit is the Volt. A battery of 6 Volts means it gives 6 Joules of energy to every Coulomb of charge.

Resistance is the opposition to the flow of current. Different materials resist current flow by different amounts. The unit is the Ohm, represented by the Greek letter Omega.

And the relationship between these three — Voltage equals Current times Resistance — is Ohm's Law. This is the most fundamental equation in all of electricity.`,

  'elec-1': `Now watch this animated circuit carefully. The yellow dots represent conventional current — flowing from the positive terminal of the battery, through the external circuit, to the negative terminal. The blue dots represent the actual electrons — which flow in the opposite direction, from negative to positive.

The battery on the left provides a voltage of 6 Volts. It acts like a pump — it continuously pushes charges around the circuit, maintaining the potential difference.

The resistor at the top — 30 Ohms — opposes the flow. Think of it like a narrow pipe that slows down the flow of water.

Using Ohm's Law — Current equals Voltage divided by Resistance equals 6 divided by 30 equals 0.2 Amperes. So 0.2 Coulombs of charge flows past any point in this circuit every second.

Notice that the current is the same everywhere in this simple circuit — at every point, 0.2 Amperes flows. This is because charge cannot accumulate anywhere — whatever flows in must flow out.

This is called Kirchhoff's Current Law — the sum of currents entering any junction equals the sum of currents leaving it.

The circuit diagram uses symbols — a long and short line for the battery, a zigzag for the resistor, and straight lines for connecting wires with zero resistance.`,

  'elec-2': `Now let us understand two very important circuit configurations — series and parallel.

In a Series Circuit, all components are connected one after another in a single loop — like beads on a string. The same current flows through every component. But the voltage gets distributed — each component takes a share of the total voltage. The total resistance is simply the sum of all individual resistances — R total equals R1 plus R2 plus R3. This means adding more resistors in series increases the total resistance and reduces the current. If one component in a series circuit breaks, the entire circuit stops working — like old Christmas lights.

In a Parallel Circuit, all components are connected across the same two points — each component has its own separate path. The same voltage appears across every component. The current splits — more current flows through paths with lower resistance. The total resistance is found using reciprocals — 1 over R total equals 1 over R1 plus 1 over R2. Adding more resistors in parallel actually decreases the total resistance and increases the total current. This is why household wiring is always parallel — every appliance gets the full supply voltage and can be switched independently.

Electric Power P equals Voltage times Current, which also equals I squared R, which also equals V squared over R. Power is measured in Watts. A 100-Watt bulb converts 100 Joules of electrical energy to light and heat every second.`,

  'elec-3': `Let us solve a complete problem on Ohm's Law and electric power.

A battery of 6 Volts is connected to a resistor of 30 Ohms. Calculate the current through the circuit and the power dissipated by the resistor.

Step 1 — given values. Voltage V equals 6 Volts. Resistance R equals 30 Ohms.

Step 2 — find current using Ohm's Law. I equals V divided by R equals 6 divided by 30 equals 0.2 Amperes.

Step 3 — find power. P equals V times I equals 6 times 0.2 equals 1.2 Watts.

Verification — Power can also be calculated as I squared R. P equals 0.2 squared times 30 equals 0.04 times 30 equals 1.2 Watts. Same answer!

Or as V squared over R. P equals 36 over 30 equals 1.2 Watts. All three formulas give the same answer — as they should.

This power of 1.2 Watts means the resistor converts 1.2 Joules of electrical energy into heat every second.

In exam problems — write down V, I, R, and P at the start. Identify which two are given and which you need to find. Then select the appropriate form of Ohm's Law or the power formula. Never mix up the formulas — write them clearly before substituting.`,

  /* ════════════════════════════════════════
     OPTICS — Class 10 Physics
  ════════════════════════════════════════ */
  'optics-0': `Hello students! Welcome to the fascinating chapter on Light — Reflection and Refraction. Light is one of the most fundamental phenomena in nature, and understanding how it behaves is essential for understanding everything from mirrors and glasses to cameras, telescopes, and optical fibers.

Let us start with Reflection — the bouncing back of light when it hits a surface.

There are two laws of reflection. Law number 1 — the incident ray, the normal to the surface at the point of incidence, and the reflected ray all lie in the same plane. Law number 2 — the angle of incidence equals the angle of reflection. Both angles are measured from the normal — the imaginary line perpendicular to the surface at the point of incidence.

These laws hold for all types of surfaces — plane mirrors, concave mirrors, and convex mirrors.

For curved mirrors, we use the Mirror Formula — 1 over v plus 1 over u equals 1 over f. Here, v is the image distance, u is the object distance, and f is the focal length.

The magnification formula is m equals minus v over u. If m is positive, the image is virtual and erect. If m is negative, the image is real and inverted.

The sign convention — all distances are measured from the pole of the mirror. Distances in the direction of incident light are positive. Distances against the direction are negative. This is the New Cartesian Sign Convention and must be applied consistently.`,

  'optics-1': `Watch this animated ray diagram for a concave mirror. A concave mirror is a mirror whose reflecting surface is curved inward — like the inside of a bowl.

The incident ray comes from the upper left, travelling towards the mirror. Notice the dashed line — that is the normal at the point where the ray hits the mirror. The reflected ray bounces off at the same angle on the other side of the normal.

The key feature of a concave mirror is its focal point F. Rays parallel to the principal axis converge at the focal point after reflection. This is why concave mirrors are called converging mirrors.

Depending on where the object is placed, the image can be real or virtual, erect or inverted, larger or smaller.

If the object is beyond the centre of curvature C — the image is real, inverted, and diminished.
If the object is at C — the image is real, inverted, and the same size.
If the object is between F and C — the image is real, inverted, and magnified.
If the object is at F — the image is at infinity — the reflected rays are parallel.
If the object is between F and the mirror — the image is virtual, erect, and magnified. This is how a concave mirror works as a shaving mirror or makeup mirror.

Concave mirrors are used in torches, car headlights, solar heaters, and reflecting telescopes — all applications that require converging light.`,

  'optics-2': `Now we move to Refraction — the bending of light when it travels from one transparent medium to another.

Why does light bend? Because light travels at different speeds in different media. In vacuum, light travels at approximately 3 times 10 to the power 8 metres per second. In water, it slows to about three quarters of that. In glass, it slows to about two thirds.

When light enters a denser medium — one where it travels slower — it bends towards the normal. When it enters a less dense medium — it bends away from the normal.

The law of refraction is given by Snell's Law — n1 sine theta 1 equals n2 sine theta 2. Here n1 and n2 are the refractive indices of the two media, and theta 1 and theta 2 are the angles of incidence and refraction, both measured from the normal.

The refractive index n of a medium is defined as the speed of light in vacuum divided by the speed of light in that medium. For glass, n is approximately 1.5. For water, n is approximately 1.33. A higher refractive index means light travels slower in that medium.

Real-life examples of refraction — a straw appears bent in a glass of water. A swimming pool appears shallower than it actually is. Rainbows form because different colors of light refract by different amounts through water droplets.`,

  'optics-3': `Now let us look at refraction through lenses. Watch the animation — the ray travels from air into glass. As it crosses the boundary, it bends towards the normal because glass is denser than air.

A convex lens is thicker in the middle and thinner at the edges. It converges light rays — brings them together. It has a positive focal length and positive power. It is called a converging lens.

A concave lens is thinner in the middle and thicker at the edges. It diverges light rays — spreads them apart. It has a negative focal length and negative power. It is called a diverging lens.

The Lens Formula is — 1 over v minus 1 over u equals 1 over f. Note — for lenses, it is 1 over v MINUS 1 over u. For mirrors, it is 1 over v PLUS 1 over u. Many students confuse these two. Remember — Lens has minus, Mirror has plus.

The Power of a lens is P equals 1 over f, where f is in metres. The unit of power is Dioptre. A convex lens of focal length 25 centimetres — which is 0.25 metres — has power 4 Dioptres. When lenses are combined, their powers simply add up.

This is why doctors prescribe spectacle power in Dioptres — plus for convex lens to correct farsightedness, minus for concave lens to correct nearsightedness.`,

  'optics-4': `Let us solve a complete problem using the mirror formula.

An object is placed 20 centimetres in front of a concave mirror with a focal length of 15 centimetres. Find the image distance and magnification.

Step 1 — apply the sign convention. Object is in front of the mirror — so u equals minus 20 centimetres. Concave mirror — focal length is negative — so f equals minus 15 centimetres.

Step 2 — apply the mirror formula. 1 over v plus 1 over u equals 1 over f. So 1 over v plus 1 over minus 20 equals 1 over minus 15.

Step 3 — solve for v. 1 over v equals 1 over minus 15 minus 1 over minus 20 equals minus 1 over 15 plus 1 over 20.

Finding common denominator — minus 4 over 60 plus 3 over 60 equals minus 1 over 60. So 1 over v equals minus 1 over 60. Therefore v equals minus 60 centimetres.

The negative sign means the image is on the same side as the object — in front of the mirror. So it is a real image.

Step 4 — find magnification. m equals minus v over u equals minus bracket minus 60 bracket divided by bracket minus 20 bracket equals minus 60 over 20 equals minus 3.

The magnitude is 3 — the image is 3 times larger than the object. The negative sign means the image is inverted.

So the image is real, inverted, and 3 times enlarged, formed 60 centimetres in front of the mirror.`
};

/* ── TTS Engine ── */
let ttsEnabled = true;
let currentUtterance = null;
const synth = window.speechSynthesis;

function getNarrationKey(){
  const item = flatSlides[currentIdx];
  return `${item.lesson.id}-${item.slideIdx}`;
}

function speak(text){
  if(!ttsEnabled || !synth) return;
  synth.cancel();
  if(!text) return;

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate  = 0.85;   // clear teacher pace
  utter.pitch = 1.0;
  utter.volume = 1.0;

  // Pick best available voice — prefer Indian English
  const voices = synth.getVoices();
  const preferred = voices.find(v => /en[-_]IN/i.test(v.lang))
    || voices.find(v => /en[-_]GB/i.test(v.lang))
    || voices.find(v => /english/i.test(v.name))
    || voices.find(v => /en/i.test(v.lang));
  if(preferred) utter.voice = preferred;

  // Auto-advance ONLY after speech ends (not on timer)
  utter.onend = () => {
    if(isPlaying && currentIdx < flatSlides.length - 1){
      setTimeout(()=> window.navigate(1), 1500); // 1.5s pause between slides
    }
  };

  currentUtterance = utter;
  synth.speak(utter);
}

function stopSpeech(){
  synth && synth.cancel();
  currentUtterance = null;
}

function toggleTTS(){
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('ttsBtn');
  if(!ttsEnabled){
    stopSpeech();
    btn.textContent = '🔇';
    btn.title = 'Voice OFF — click to enable';
    btn.style.opacity = '.45';
  } else {
    btn.textContent = '🔊';
    btn.title = 'Voice ON — click to mute';
    btn.style.opacity = '1';
    // speak current slide
    speak(NARRATION[getNarrationKey()]);
  }
}

// Hook into render — speak when slide changes
const _origRender = render;
window.renderWithTTS = function(){
  _origRender();
  // small delay so slide content paints first
  setTimeout(()=> speak(NARRATION[getNarrationKey()]), 400);
};

// Override navigate to use renderWithTTS
const _origNavigate = navigate;
window.navigate = function(dir){
  stopSpeech();
  currentIdx = Math.max(0, Math.min(flatSlides.length-1, currentIdx+dir));
  window.renderWithTTS();
  document.getElementById('player').scrollIntoView({behavior:'smooth',block:'start'});
};

// Override togglePlay to pause/resume speech
const _origToggle = togglePlay;
window.togglePlay = function(){
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
  if(!isPlaying) stopSpeech();
  else speak(NARRATION[getNarrationKey()]);
};

// Override jumpToLesson
window.jumpToLesson = function(lessonIdx){
  const idx = flatSlides.findIndex(f=>f.lessonIdx===lessonIdx);
  if(idx>=0){ currentIdx=idx; stopSpeech(); window.renderWithTTS(); }
  document.getElementById('player').scrollIntoView({behavior:'smooth'});
};

window.jumpToSubject = function(subj){
  const idx = flatSlides.findIndex(f=>f.lesson.subject===subj);
  if(idx>=0){ currentIdx=idx; stopSpeech(); window.renderWithTTS(); }
};

// Re-wire keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); window.navigate(1); }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); window.navigate(-1); }
  if(e.key===' '){ e.preventDefault(); window.togglePlay(); }
  if(e.key==='m'||e.key==='M') toggleTTS();
});

// Add 🔊 button to controls bar
(function addTTSButton(){
  const controls = document.querySelector('.controls');
  const btn = document.createElement('button');
  btn.id = 'ttsBtn';
  btn.className = 'ctrl-btn';
  btn.textContent = '🔊';
  btn.title = 'Voice ON — click to mute (M)';
  btn.style.cssText = 'background:rgba(99,102,241,.25);color:#a5b4fc;font-size:1.1rem;border:1px solid rgba(99,102,241,.5);';
  btn.onclick = toggleTTS;
  // insert before chapter-map-btn
  const mapBtn = controls.querySelector('.chapter-map-btn');
  controls.insertBefore(btn, mapBtn);
})();

// Voices may load async — retry
synth.addEventListener('voiceschanged', ()=>{
  // re-speak if already on a slide
  if(ttsEnabled) speak(NARRATION[getNarrationKey()]);
});

// Speak first slide on load
setTimeout(()=> window.renderWithTTS(), 800);
</script>
</body>
</html>
